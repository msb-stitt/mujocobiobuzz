name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build
      - name: Sync dependencies
        run: uv sync --locked
      - name: ninja check
        run: ninja check
