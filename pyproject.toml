[project]
name = "mujocobiobuzz"
version = "0.1.0"
description = "The BIOBUZZ field and FTC robots 31459 and 37523 in MuJoCo."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujocobiobuzz"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "prek>=0.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the network, a large download, a GPU or minutes of run; skips when what it needs is missing",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
